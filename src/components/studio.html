<section class="studio" id="studio">
  <div class="studio__container">
    <div class="studio__header">
      <span class="studio__badge">Студия</span>
      <h2 class="studio__title">Мы рядом</h2>
      <p class="studio__description">Уютное пространство в центре Петербурга</p>
    </div>
    <div class="studio__layout">
      <!-- Photo Block with Working Hours & Phone Pills -->
      <div class="studio__card studio__card--photo">
        <img
          src="./src/assets/images/webp/studio.webp"
          alt="Интерьер студии"
          class="studio__card-image"
          loading="lazy"
        />
        <div class="studio__pills studio__pills--bottom">
          <a
            href="https://yandex.ru/maps/-/CTs6NL~x"
            target="_blank"
            rel="noopener"
            class="studio__pill studio__pill--link"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"
              />
              <circle cx="12" cy="10" r="3" />
            </svg>
            <span>Невский 160</span>
          </a>

          <div class="studio__pill">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
            <span>Пн-Вс: 11:00 – 22:00</span>
          </div>
        </div>
      </div>

      <!-- Map Block -->
      <div class="studio__card studio__card--map">
        <div class="studio__map-wrapper">
          <iframe
            src="https://yandex.ru/map-widget/v1/?ll=30.376289%2C59.927134&z=17&pt=30.376289%2C59.927134%2Cflag&l=map"
            width="100%"
            height="100%"
            frameborder="0"
            allowfullscreen="true"
            loading="lazy"
            class="studio__map-iframe"
            title="Карта студии на Яндекс.Картах"
          ></iframe>
          <div class="studio__map-overlay"></div>
        </div>
      </div>
    </div>
  </div>
</section>
